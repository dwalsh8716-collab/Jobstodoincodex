name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Build, test and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release verification
        run: npm run verify

      - name: Validate Sanity schema
        run: npm run sanity -- schema validate

      - name: Check database configuration
        run: npm run db:status

      - name: Check retention runner
        run: npm run retention:check
