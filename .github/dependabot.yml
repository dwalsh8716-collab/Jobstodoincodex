version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependency-management
      - ci-quality
    groups:
      next-sanity-patches:
        patterns:
          - next
          - next-sanity
          - sanity
          - "@sanity/*"
        update-types:
          - patch
          - minor
      test-and-tooling-patches:
        patterns:
          - eslint
          - eslint-config-next
          - prettier
          - vitest
          - typescript
          - "@types/*"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependency-management
      - ci-quality
